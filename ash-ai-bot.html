<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Restaurant AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0E1116;
    --surface:#161A22;
    --surface-2:#1D2230;
    --sidebar:#12151C;
    --border:#262C3B;
    --text:#E9EAEE;
    --text-dim:#8992A6;
    --accent:#FF8A3D;
    --accent-dim:#4A3623;
    --user-bubble:#232A3B;
    --error:#3A1D22;
    --error-text:#FF9C9C;
    --radius:16px;
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    height:var(--app-height, 100dvh);
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  body{
    display:flex;
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:260px;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    height:100vh;
    height:var(--app-height, 100dvh);
    position:fixed;
    top:0; left:0;
    z-index:40;
    transform:translateX(-100%);
    transition:transform 220ms cubic-bezier(0.2,0.8,0.2,1);
  }

  #sidebar.open{
    transform:translateX(0);
  }

  @media (min-width:900px){
    #sidebar{ position:static; transform:none; }
    #sidebar-backdrop{ display:none !important; }
  }

  #sidebar-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    z-index:35;
    display:none;
  }

  #sidebar-backdrop.show{ display:block; }

  .sidebar-top{
    padding:14px;
    border-bottom:1px solid var(--border);
  }

  #new-chat-btn{
    width:100%;
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 14px;
    border-radius:22px;
    font-family:'Manrope',sans-serif;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    transition:background 140ms ease, border-color 140ms ease;
  }

  #new-chat-btn:hover{
    background:var(--surface);
    border-color:var(--accent);
  }

  #new-chat-btn svg{ width:16px; height:16px; flex-shrink:0; }

  .sidebar-label{
    font-family:'Manrope',sans-serif;
    font-size:11.5px;
    font-weight:700;
    color:var(--text-dim);
    padding:14px 16px 6px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .sync-badge{
    display:flex;
    align-items:center;
    gap:4px;
    font-weight:600;
    font-size:10.5px;
    color:#57D68D;
  }

  .sync-badge svg{ width:10px; height:10px; }

  #history-list{
    flex:1;
    overflow-y:auto;
    padding:0 8px 8px;
  }

  #history-list::-webkit-scrollbar{ width:5px; }
  #history-list::-webkit-scrollbar-thumb{ background:var(--border); border-radius:10px; }

  .history-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 10px;
    border-radius:10px;
    cursor:pointer;
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:2px;
    transition:background 120ms ease, color 120ms ease;
    position:relative;
  }

  .history-item:hover{
    background:var(--surface-2);
    color:var(--text);
  }

  .history-item.active{
    background:var(--accent-dim);
    color:var(--accent);
  }

  .history-title{
    flex:1;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .history-delete{
    background:transparent;
    border:none;
    color:inherit;
    opacity:0;
    cursor:pointer;
    padding:2px;
    display:flex;
    flex-shrink:0;
    transition:opacity 120ms ease;
  }

  .history-item:hover .history-delete{ opacity:0.7; }
  .history-delete:hover{ opacity:1 !important; }
  .history-delete svg{ width:14px; height:14px; }

  .empty-history{
    color:var(--text-dim);
    font-size:12.5px;
    padding:10px;
    text-align:center;
  }

  /* ---------- Main column ---------- */
  #main-col{
    flex:1;
    display:flex;
    flex-direction:column;
    height:100vh;
    height:var(--app-height, 100dvh);
    min-width:0;
  }

  header{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
    position:sticky;
    top:0;
    z-index:20;
  }

  #menu-btn{
    background:transparent;
    border:none;
    color:var(--text-dim);
    width:34px;
    height:34px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }

  #menu-btn:hover{ background:rgba(255,255,255,0.06); color:var(--text); }
  #menu-btn svg{ width:20px; height:20px; }

  #voice-select{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:'Inter',sans-serif;
    font-size:12px;
    padding:6px 8px;
    border-radius:8px;
    max-width:120px;
    flex-shrink:0;
  }
  #voice-select:focus{ outline:none; border-color:var(--accent); color:var(--text); }

  @media (min-width:900px){
    #menu-btn{ display:none; }
  }

  .brand-mark{
    width:34px;
    height:34px;
    border-radius:10px;
    background:linear-gradient(135deg, var(--accent), #FFB870);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:14px;
    color:#1A0E00;
    flex-shrink:0;
  }

  .brand-info{ display:flex; flex-direction:column; line-height:1.25; }
  .brand-title{ font-family:'Manrope',sans-serif; font-weight:700; font-size:15px; color:var(--text); }
  .brand-status{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-dim); }

  .status-dot{
    width:6px; height:6px; border-radius:50%;
    background:#57D68D;
    box-shadow:0 0 0 0 rgba(87,214,141,0.5);
    animation:pulse-dot 2.4s ease-out infinite;
  }

  .status-dot.offline{ background:#FF6E6E; }

  @keyframes pulse-dot{
    0%{box-shadow:0 0 0 0 rgba(87,214,141,0.45);}
    70%{box-shadow:0 0 0 6px rgba(87,214,141,0);}
    100%{box-shadow:0 0 0 0 rgba(87,214,141,0);}
  }

  #sound-toggle{
    margin-left:auto;
    background:transparent;
    border:none;
    color:var(--text-dim);
    width:34px;
    height:34px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }

  #sound-toggle:hover{ background:rgba(255,255,255,0.06); color:var(--text); }
  #sound-toggle svg{ width:19px; height:19px; }

  /* ---------- Chat area ---------- */
  main{
    flex:1;
    overflow-y:auto;
    padding:24px 10px 12px;
    max-width:900px;
    width:100%;
    margin:0 auto;
    scroll-behavior:smooth;
  }

  main::-webkit-scrollbar{ width:6px; }
  main::-webkit-scrollbar-thumb{ background:var(--border); border-radius:10px; }

  .row{
    display:flex;
    gap:10px;
    margin-bottom:6px;
    max-width:100%;
    animation:rise-in 260ms cubic-bezier(0.2,0.8,0.2,1) both;
  }

  @keyframes rise-in{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }

  .row.user{ flex-direction:row-reverse; }

  .msg-wrap{
    display:flex;
    flex-direction:column;
    max-width:94%;
    width:100%;
  }

  .row.user .msg-wrap{ align-items:flex-end; max-width:88%; width:auto; }

  .avatar{
    width:30px; height:30px;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px; font-weight:500; letter-spacing:0.02em;
  }

  .avatar.ai{ background:var(--accent-dim); color:var(--accent); border:1px solid rgba(255,138,61,0.25); }
  .avatar.user{ background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border); }

  .bubble{
    padding:12px 15px;
    border-radius:var(--radius);
    font-size:14.5px;
    line-height:1.55;
    white-space:pre-wrap;
    word-wrap:break-word;
  }

  .row.ai .bubble{
    background:var(--surface);
    border:1px solid var(--border);
    border-top-left-radius:4px;
    color:var(--text);
  }

  .row.user .bubble{
    background:var(--user-bubble);
    border-top-right-radius:4px;
    color:var(--text);
  }

  .bubble.error{
    background:var(--error);
    border:1px solid rgba(255,110,110,0.25);
    color:var(--error-text);
  }

  .msg-actions{
    display:flex;
    gap:6px;
    margin-top:4px;
    opacity:0;
    transition:opacity 140ms ease;
  }

  .row:hover .msg-actions{ opacity:1; }

  .msg-actions button{
    background:transparent;
    border:none;
    color:var(--text-dim);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:4px;
    font-size:11.5px;
    padding:3px 6px;
    border-radius:6px;
  }

  .msg-text strong{ font-weight:700; }
  .msg-text em{ font-style:italic; }
  .msg-text code{
    background:rgba(255,255,255,0.08);
    padding:1px 5px;
    border-radius:4px;
    font-family:'SFMono-Regular',Consolas,monospace;
    font-size:0.9em;
  }
  .msg-text pre{
    background:rgba(0,0,0,0.35);
    padding:10px 12px;
    border-radius:8px;
    overflow-x:auto;
    margin:6px 0;
  }
  .msg-text pre code{ background:none; padding:0; }

  .ai-meta{
    display:flex;
    align-items:center;
    gap:4px;
    margin-top:6px;
    width:100%;
  }

  .ai-meta .ai-actions{ margin-top:0; width:auto; gap:2px; }
  .ai-meta .msg-time{
    font-size:11px;
    color:var(--text-dim);
    margin-left:auto;
    white-space:nowrap;
  }

  .ai-actions .regen-btn.spinning svg{ animation:spin 0.8s linear infinite; }
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  .msg-actions button:hover{ background:var(--surface-2); color:var(--text); }
  .msg-actions svg{ width:13px; height:13px; }

  .ai-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
    margin-top:6px;
  }

  .ai-actions button{
    background:transparent;
    border:none;
    color:var(--text-dim);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    width:28px;
    height:28px;
    border-radius:8px;
    flex-shrink:0;
  }

  .ai-actions button:hover{ background:var(--surface-2); color:var(--text); }
  .ai-actions svg{ width:15px; height:15px; }

  .ai-actions .copy-btn.done{ color:#57D68D; }
  .ai-actions .copy-btn.fail{ color:#E5544E; }
  .ai-actions .speak-btn.speaking{ color:var(--accent); background:var(--accent-dim); }

  .typing{
    display:inline-flex; align-items:center; gap:4px; padding:4px 2px;
  }

  .typing span{
    width:6px; height:6px; border-radius:50%;
    background:var(--text-dim);
    animation:bounce 1.1s infinite ease-in-out;
  }

  .typing span:nth-child(2){ animation-delay:0.15s; }
  .typing span:nth-child(3){ animation-delay:0.3s; }

  @keyframes bounce{
    0%, 60%, 100%{transform:translateY(0); opacity:0.5;}
    30%{transform:translateY(-4px); opacity:1;}
  }

  /* ---------- Footer / input ---------- */
  footer{
    background:var(--surface);
    border-top:1px solid var(--border);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    flex-shrink:0;
    position:sticky;
    bottom:0;
    z-index:20;
  }

  #edit-banner{
    max-width:760px;
    margin:0 auto 8px;
    display:none;
    align-items:center;
    justify-content:space-between;
    background:var(--accent-dim);
    border:1px solid rgba(255,138,61,0.3);
    color:var(--accent);
    font-size:12.5px;
    padding:7px 12px;
    border-radius:10px;
  }

  #edit-banner.active{ display:flex; }
  #edit-banner button{
    background:transparent; border:none; color:var(--accent);
    cursor:pointer; font-size:12px; font-weight:600;
  }

  form{
    max-width:760px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:5px 5px 5px 6px;
    transition:border-color 160ms ease, box-shadow 160ms ease;
  }

  form:focus-within{
    border-color:rgba(255,138,61,0.5);
    box-shadow:0 0 0 3px rgba(255,138,61,0.12);
  }

  .icon-btn{
    background:transparent; border:none; color:var(--text-dim);
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
    transition:background 140ms ease, color 140ms ease;
  }

  .icon-btn:hover{ background:rgba(255,255,255,0.06); color:var(--text); }
  .icon-btn svg{ width:20px; height:20px; }

  #mic-btn.recording{
    color:#ff4d4d;
    background:rgba(255,77,77,0.12);
    animation:mic-pulse 1.1s ease-in-out infinite;
  }
  @keyframes mic-pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(255,77,77,0.35); }
    50%{ box-shadow:0 0 0 8px rgba(255,77,77,0); }
  }

  input[type="text"]{
    flex:1; background:transparent; border:none; outline:none;
    color:var(--text); font-family:'Inter',sans-serif; font-size:14.5px;
    padding:10px 0; min-width:0;
  }

  input[type="text"]::placeholder{ color:var(--text-dim); }

  button[type="submit"]{
    background:var(--accent); color:#1A0E00; border:none;
    border-radius:10px; font-family:'Manrope',sans-serif;
    font-weight:700; font-size:13.5px; padding:0 18px; height:40px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    min-width:70px; flex-shrink:0;
    transition:transform 120ms ease, background 160ms ease, opacity 160ms ease;
  }

  button[type="submit"]:hover:not(:disabled){ background:#FF9A57; }
  button[type="submit"]:active:not(:disabled){ transform:scale(0.96); }
  button:disabled{ opacity:0.55; cursor:default; }

  /* ---------- Attachments (Plus button, bottom sheet, previews) ---------- */
  #plus-btn{ order:-1; }

  .pending-attachments{
    max-width:760px;
    margin:0 auto 8px;
    display:none;
    flex-wrap:wrap;
    gap:8px;
    padding:0 2px;
  }
  .pending-attachments.show{ display:flex; }

  .pending-thumb{
    position:relative;
    width:56px; height:56px;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--border);
    flex-shrink:0;
  }
  .pending-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .pending-thumb .remove-thumb{
    position:absolute; top:-2px; right:-2px;
    width:18px; height:18px; border-radius:50%;
    background:#1A0E00; color:#fff; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; line-height:1; cursor:pointer; padding:0;
  }

  .attach-preview{
    display:block;
    max-width:220px;
    max-height:220px;
    border-radius:12px;
    margin-bottom:6px;
    object-fit:cover;
  }

  /* Bottom sheet modal for Camera / Photos & Videos */
  #attachment-modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    z-index:60;
    display:none;
    align-items:flex-end;
    justify-content:center;
  }
  #attachment-modal.show{ display:flex; }

  #attachment-modal .sheet{
    width:100%;
    max-width:480px;
    background:var(--surface);
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:18px 18px 0 0;
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));
    animation:sheet-up 180ms cubic-bezier(0.2,0.8,0.2,1);
  }
  @keyframes sheet-up{
    from{ transform:translateY(100%); }
    to{ transform:translateY(0); }
  }

  #attachment-modal .sheet-option{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    background:transparent;
    border:none;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:500;
    padding:14px 10px;
    border-radius:12px;
    cursor:pointer;
    text-align:left;
  }
  #attachment-modal .sheet-option:hover{ background:var(--surface-2); }
  #attachment-modal .sheet-option svg{ width:22px; height:22px; flex-shrink:0; color:var(--accent); }

  #attachment-modal .sheet-divider{
    height:1px; background:var(--border); margin:4px 6px;
  }

  #attachment-modal .sheet-cancel{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:14px;
    padding:12px;
    border-radius:12px;
    margin-top:8px;
    cursor:pointer;
  }
</style>
</head>
<body>

<div id="sidebar-backdrop"></div>

<aside id="sidebar">
  <div class="sidebar-top">
    <button id="new-chat-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      New chat
    </button>
  </div>
  <div class="sidebar-label">
    <span>Recent chats</span>
    <span class="sync-badge" id="sync-badge">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"></circle></svg>
      Saved
    </span>
  </div>
  <div id="history-list"></div>
</aside>

<div id="main-col">
  <header>
    <button id="menu-btn" type="button" title="Chat history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <div class="brand-mark">AI</div>
    <div class="brand-info">
      <div class="brand-title">Zamir Ai</div>
      <div class="brand-status"><span class="status-dot" id="status-dot"></span><span id="status-text">Connecting...</span></div>
    </div>
    <select id="voice-select" title="Voice">
      <option value="gemini:Ursa" selected>Ursa (Gemini)</option>
      <option value="gemini:Puck">Puck (Gemini)</option>
      <option value="gemini:Kore">Kore (Gemini)</option>
      <option value="gemini:Charon">Charon (Gemini)</option>
      <option value="browser">System voice</option>
    </select>
    <button id="sound-toggle" type="button" title="Sound on/off">
      <svg id="sound-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
    </button>
  </header>

  <main id="chat-container"></main>

  <footer>
    <div id="edit-banner">
      <span>Editing message</span>
      <button type="button" id="cancel-edit-btn">Cancel</button>
    </div>

    <div class="pending-attachments" id="pending-attachments"></div>

    <form id="chat-form" autocomplete="off">
      <button type="button" id="plus-btn" class="icon-btn" title="Add attachment">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>

      <input type="text" id="user-input" placeholder="Type your question here..." autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" name="chat-message-field" data-lpignore="true" data-form-type="other">

      <button type="button" id="mic-btn" class="icon-btn" title="Voice input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
      </button>

      <button type="submit" id="send-btn"><span id="send-label">Send</span></button>

      <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;">
      <input type="file" id="gallery-input" accept="image/*" multiple style="display:none;">
    </form>
  </footer>
</div>

<div id="attachment-modal">
  <div class="sheet">
    <button type="button" class="sheet-option" id="sheet-camera-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
      Camera
    </button>
    <div class="sheet-divider"></div>
    <button type="button" class="sheet-option" id="sheet-gallery-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
      Photos &amp; Videos
    </button>
    <button type="button" class="sheet-cancel" id="sheet-cancel-btn">Cancel</button>

</div>

<script>
  /* ---------------- Config ---------------- */
  const STREAM_URL = '/api/gemini';
  const STORAGE_KEY = 'restaurant_chat_sessions';
  const WELCOME_TEXT = 'Welcome! 🍽️ I\'m your Restaurant Assistant. Ask me about our menu, prices, timings, or anything about our restaurant!';

  /* ---------------- Elements ---------------- */
  const chatContainer = document.getElementById('chat-container');
  const chatForm = document.getElementById('chat-form');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const sendLabel = document.getElementById('send-label');
  const micBtn = document.getElementById('mic-btn');
  const voiceSelect = document.getElementById('voice-select');
  const plusBtn = document.getElementById('plus-btn');
  const attachmentModal = document.getElementById('attachment-modal');
  const sheetCameraBtn = document.getElementById('sheet-camera-btn');
  const sheetGalleryBtn = document.getElementById('sheet-gallery-btn');
  const sheetCancelBtn = document.getElementById('sheet-cancel-btn');
  const cameraInput = document.getElementById('camera-input');
  const galleryInput = document.getElementById('gallery-input');
  const pendingAttachmentsBar = document.getElementById('pending-attachments');

  /* ---------------- Attachment (image) handling ----------------
     pendingAttachments holds { mimeType, base64, previewUrl } objects
     staged before the message is sent. The "+" button opens a bottom
     sheet with Camera / Photos & Videos, either of which fills a
     hidden <input type="file">; selected images are read as Base64
     and shown as removable thumbnails above the input bar until Send
     is pressed, at which point they become that message's attachments. */
  let pendingAttachments = [];

  function openAttachmentModal(){ attachmentModal.classList.add('show'); }
  function closeAttachmentModal(){ attachmentModal.classList.remove('show'); }

  plusBtn.addEventListener('click', openAttachmentModal);
  sheetCancelBtn.addEventListener('click', closeAttachmentModal);
  attachmentModal.addEventListener('click', (e) => {
    if (e.target === attachmentModal) closeAttachmentModal();
  });

  sheetCameraBtn.addEventListener('click', () => {
    closeAttachmentModal();
    // Live rear camera (flip button se front); block ho to overlay me native-camera fallback
    ZCam.open('environment', (dataUrl) => {
      pendingAttachments.push({
        mimeType: 'image/jpeg',
        base64: dataUrl.split(',')[1],
        previewUrl: dataUrl
      });
      renderPendingAttachments();
      keepFocus();
    });
  });
  sheetGalleryBtn.addEventListener('click', () => {
    closeAttachmentModal();
    galleryInput.click();
  });

  function renderPendingAttachments(){
    if (!pendingAttachments.length){
      pendingAttachmentsBar.innerHTML = '';
      pendingAttachmentsBar.classList.remove('show');
      return;
    }
    pendingAttachmentsBar.classList.add('show');
    pendingAttachmentsBar.innerHTML = pendingAttachments.map((att, i) => `
      <div class="pending-thumb" data-i="${i}">
        <img src="${att.previewUrl}" alt="attachment preview">
        <button type="button" class="remove-thumb" data-i="${i}" title="Remove">&times;</button>
      </div>
    `).join('');
    pendingAttachmentsBar.querySelectorAll('.pending-thumb img').forEach((im, i) => {
      const att = pendingAttachments[i];
      im.addEventListener('error', () => {
        const k = pendingAttachments.indexOf(att);
        if (k > -1) { pendingAttachments.splice(k, 1); renderPendingAttachments(); }
      });
    });
    pendingAttachmentsBar.querySelectorAll('.remove-thumb').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.i, 10);
        pendingAttachments.splice(idx, 1);
        renderPendingAttachments();
      });
    });
  }

  function readFileAsBase64(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        const img = new Image();
        img.onload = () => {
          try {
            const MAX = 1280;
            let w = img.naturalWidth, h = img.naturalHeight;
            const k = Math.min(1, MAX / Math.max(w, h));
            w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
            const c = document.createElement('canvas'); c.width = w; c.height = h;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            const out = c.toDataURL('image/jpeg', 0.8);
            c.width = c.height = 0;
            resolve({ mimeType: 'image/jpeg', base64: out.split(',')[1], previewUrl: out });
          } catch (err) {
            resolve({ mimeType: file.type || 'image/jpeg', base64: dataUrl.split(',')[1], previewUrl: dataUrl });
          }
        };
        img.onerror = () => resolve({ mimeType: file.type || 'image/jpeg', base64: dataUrl.split(',')[1], previewUrl: dataUrl });
        img.src = dataUrl;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  const __seenFiles = new Map();
  async function handleFileSelect(e){
    const files = Array.from(e.target.files || []);
    for (const file of files){
      if (!file.type.startsWith('image/')) continue;
      const fkey = file.name + '|' + file.size + '|' + file.lastModified;
      const nowT = Date.now();
      if (__seenFiles.has(fkey) && nowT - __seenFiles.get(fkey) < 4000) continue;   // duplicate change event
      __seenFiles.set(fkey, nowT);
      try {
        const att = await readFileAsBase64(file);
        pendingAttachments.push(att);
      } catch (err) {
        console.warn('Failed to read attachment:', err);
      }
    }
    renderPendingAttachments();
    e.target.value = '';
    keepFocus();
  }

  cameraInput.addEventListener('change', handleFileSelect);
  galleryInput.addEventListener('change', handleFileSelect);

  /* ---------------- Voice selection persistence ----------------
     The chosen voice (Ursa, Puck, Kore, Charon, or System voice) is
     saved to localStorage and reloaded on every visit, so it stays
     fixed until the user themselves changes it — it never resets or
     randomly changes on its own. */
  const VOICE_STORAGE_KEY = 'zmrai_selected_voice';

  (function restoreSavedVoice() {
    try {
      const saved = localStorage.getItem(VOICE_STORAGE_KEY);
      if (saved && [...voiceSelect.options].some(opt => opt.value === saved)) {
        voiceSelect.value = saved;
      }
    } catch (_) { /* localStorage unavailable — fall back to the HTML default */ }
  })();

  voiceSelect.addEventListener('change', async () => {
    try {
      localStorage.setItem(VOICE_STORAGE_KEY, voiceSelect.value);
    } catch (_) { /* ignore storage errors, selection still works for this session */ }

    // Stop any currently playing audio immediately — new voice applies now.
    window.speechSynthesis.cancel();
    stopGeminiVoice();

    const voiceLabel = voiceSelect.options[voiceSelect.selectedIndex].textContent.split(' ')[0];
    const previewText = 'Hi, this is ' + voiceLabel + '.';

    const usedGemini = await speakWithGemini(previewText, null, null);
    if (usedGemini) return;

    if (!('speechSynthesis' in window)) return;
    const utterance = new SpeechSynthesisUtterance(previewText);
    utterance.lang = FIXED_SPEECH_LANG;
    window.speechSynthesis.speak(utterance);
  });

  const sidebar = document.getElementById('sidebar');
  const sidebarBackdrop = document.getElementById('sidebar-backdrop');
  const menuBtn = document.getElementById('menu-btn');
  const newChatBtn = document.getElementById('new-chat-btn');
  const historyList = document.getElementById('history-list');
  const editBanner = document.getElementById('edit-banner');
  const cancelEditBtn = document.getElementById('cancel-edit-btn');
  const soundToggle = document.getElementById('sound-toggle');
  const soundIcon = document.getElementById('sound-icon');
  const statusDot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  const syncBadge = document.getElementById('sync-badge');

  /* ---------------- Mobile viewport height fix ----------------
     100dvh doesn't always update instantly on Android Chrome when the
     on-screen keyboard opens/closes, which was pushing the latest
     message up behind the header until the user manually scrolled.
     We track the real visual viewport height in JS and re-run
     scrollToBottom() whenever it changes.

     Fix for header/input bar sliding out of view with the keyboard open:
     on some Android browsers, opening the keyboard PANS the visual
     viewport (instead of resizing the layout viewport), which can leave
     our fixed-height header/footer positioned above or below what's
     actually visible on screen. Forcing window.scrollTo(0,0) on every
     visualViewport change keeps the layout pinned to the visible area. */
  function setAppHeight() {
    const vv = window.visualViewport;
    const h = (vv ? vv.height : window.innerHeight);
    document.documentElement.style.setProperty('--app-height', h + 'px');
    // Belt-and-suspenders: also set the pixel height directly on the
    // containers, in case a browser doesn't recompute the CSS var()
    // consumers reliably on every visualViewport change.
    const mainCol = document.getElementById('main-col');
    if (mainCol) mainCol.style.height = h + 'px';
    const sidebarEl = document.getElementById('sidebar');
    if (sidebarEl) sidebarEl.style.height = h + 'px';
    if (vv) {
      // Pin the whole page to the visible visual viewport instead of
      // fighting it with scrollTo(0,0): this keeps the header glued to
      // the top and the footer glued directly above the keyboard, with
      // no drift/gap when the keyboard opens or closes.
      document.body.style.position = 'fixed';
      document.body.style.top = (-vv.offsetTop) + 'px';
      document.body.style.left = (-vv.offsetLeft) + 'px';
      document.body.style.width = '100%';
      document.body.style.height = h + 'px';
    }
  }
  setAppHeight();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
      setAppHeight();
      scrollToBottom();
    });
    window.visualViewport.addEventListener('scroll', () => {
      setAppHeight();
    });
  }
  window.addEventListener('resize', () => {
    setAppHeight();
    scrollToBottom();
  });
  window.addEventListener('orientationchange', () => {
    setTimeout(() => { setAppHeight(); scrollToBottom(); }, 200);
  });

  function resyncViewportBurst() {
    [50, 150, 300, 450, 650].forEach(delay => {
      setTimeout(() => { setAppHeight(); scrollToBottom(); }, delay);
    });
  }

  userInput.addEventListener('blur', resyncViewportBurst);
  userInput.addEventListener('focus', resyncViewportBurst);

  /* ---------------- State ---------------- */
  let sessions = [];                      // array of { id, title, updatedAt, messages:[{role,text,attachments}] }
  let currentSessionId = null;
  let isSending = false;
  let editingIndex = null;
  let soundOn = true;
  const responseCache = new Map();

  /* ---------------- localStorage helpers ---------------- */
  function loadFromStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (_) { return []; }
  }

  function saveToStorage() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
    } catch (_) {}
  }

  /* ---------------- Init from localStorage ---------------- */
  (function init() {
    sessions = loadFromStorage().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    // Show as online (local, always available)
    statusDot.classList.remove('offline');
    statusText.textContent = 'Online';
    if (sessions.length === 0) {
      createSession();
    } else {
      currentSessionId = sessions[0].id;
      renderCurrentSession();
    }
    renderHistoryList();
  })();

  function getCurrentSession() {
    return sessions.find(s => s.id === currentSessionId);
  }

  function saveSession(session) {
    session.updatedAt = Date.now();
    const idx = sessions.findIndex(s => s.id === session.id);
    if (idx >= 0) sessions[idx] = session; else sessions.unshift(session);
    sessions.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    saveToStorage();
  }

  /* ---------------- Session management ---------------- */
  function createSession() {
    const session = { id: 'c' + Date.now(), title: 'New chat', updatedAt: Date.now(), messages: [] };
    sessions.unshift(session);
    currentSessionId = session.id;
    saveToStorage();
    renderCurrentSession();
    closeSidebarOnMobile();
  }

  function loadSession(id) {
    currentSessionId = id;
    editingIndex = null;
    hideEditBanner();
    renderHistoryList();
    renderCurrentSession();
    closeSidebarOnMobile();
  }

  function deleteSession(id, evt) {
    evt.stopPropagation();
    sessions = sessions.filter(s => s.id !== id);
    saveToStorage();
    if (currentSessionId === id) {
      if (sessions.length > 0) {
        loadSession(sessions[0].id);
      } else {
        createSession();
      }
    }
    renderHistoryList();
  }

  function renderHistoryList() {
    if (sessions.length === 0) {
      historyList.innerHTML = '<div class="empty-history">No chat history yet</div>';
      return;
    }
    historyList.innerHTML = sessions.map(s => `
      <div class="history-item ${s.id === currentSessionId ? 'active' : ''}" data-id="${s.id}">
        <span class="history-title">${escapeHtml(s.title || 'New chat')}</span>
        <button class="history-delete" data-id="${s.id}" title="Delete">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
        </button>
      </div>
    `).join('');

    historyList.querySelectorAll('.history-item').forEach(item => {
      item.addEventListener('click', () => loadSession(item.dataset.id));
    });
    historyList.querySelectorAll('.history-delete').forEach(btn => {
      btn.addEventListener('click', (e) => deleteSession(btn.dataset.id, e));
    });
  }

  function renderCurrentSession() {
    const session = getCurrentSession();
    chatContainer.innerHTML = '';
    if (!session || !session.messages || session.messages.length === 0) {
      appendMessageDOM({ role: 'ai', text: WELCOME_TEXT, attachments: [] }, -1);
      return;
    }
    session.messages.forEach((msg, idx) => appendMessageDOM(msg, idx));
    scrollToBottom();
  }

  function updateSessionTitle(session) {
    if (session.title && session.title !== 'New chat') return;
    const firstUserMsg = session.messages.find(m => m.role === 'user');
    if (firstUserMsg && firstUserMsg.text) {
      session.title = firstUserMsg.text.slice(0, 40) + (firstUserMsg.text.length > 40 ? '…' : '');
    } else if (firstUserMsg) {
      session.title = 'Photo message';
    }
  }

  /* ---------------- Sidebar toggling ---------------- */
  menuBtn.addEventListener('click', () => {
    sidebar.classList.add('open');
    sidebarBackdrop.classList.add('show');
  });
  sidebarBackdrop.addEventListener('click', closeSidebarOnMobile);
  newChatBtn.addEventListener('click', createSession);

  function closeSidebarOnMobile() {
    sidebar.classList.remove('open');
    sidebarBackdrop.classList.remove('show');
  }

  /* ---------------- Sound effects (Web Audio API, no external files) ---------------- */
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playTone(freq, duration, type = 'sine', volume = 0.08) {
    if (!soundOn) return;
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(volume, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch (_) {}
  }

  function playSendSound() { playTone(720, 0.09, 'sine', 0.07); }
  function playReceiveSound() {
    playTone(520, 0.08, 'sine', 0.06);
    setTimeout(() => playTone(660, 0.1, 'sine', 0.06), 70);
  }

  soundToggle.addEventListener('click', () => {
    soundOn = !soundOn;
    soundIcon.innerHTML = soundOn
      ? '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>'
      : '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>';
  });


  /* ---------------- Edit message ---------------- */
  function startEdit(index) {
    const session = getCurrentSession();
    const msg = session.messages[index];
    if (!msg || msg.role !== 'user') return;

    editingIndex = index;
    userInput.value = msg.text || '';
    showEditBanner();
    keepFocus();
  }

  function showEditBanner() { editBanner.classList.add('active'); }
  function hideEditBanner() { editBanner.classList.remove('active'); editingIndex = null; }

  cancelEditBtn.addEventListener('click', () => {
    hideEditBanner();
    userInput.value = '';
    keepFocus();
  });

  /* ---------------- Send flow ---------------- */
  /* ---------------- Voice input (Speech-to-Text) ---------------- */
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer = null;
  let isRecording = false;

  if (SpeechRecognitionAPI) {
    recognizer = new SpeechRecognitionAPI();
    recognizer.continuous = false;
    recognizer.interimResults = true;
    recognizer.lang = 'en-IN'; // English speech -> English text; Hindi speech -> phonetic Hinglish (Roman script), never Devanagari.

    recognizer.onresult = (event) => {
      let transcript = '';
      for (let i = 0; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }
      userInput.value = transcript;
    };

    recognizer.onerror = () => {
      isRecording = false;
      micBtn.classList.remove('recording');
    };

    recognizer.onend = () => {
      isRecording = false;
      micBtn.classList.remove('recording');

      const finalText = userInput.value.trim();
      if (finalText) {
        if (chatForm.requestSubmit) chatForm.requestSubmit();
        else chatForm.dispatchEvent(new Event('submit', { cancelable: true }));
      } else {
        keepFocus();
      }
    };

    micBtn.addEventListener('click', () => {
      if (isRecording) {
        recognizer.stop();
        return;
      }
      isRecording = true;
      micBtn.classList.add('recording');
      try {
        recognizer.start();
      } catch (err) {
        isRecording = false;
        micBtn.classList.remove('recording');
      }
    });
  } else {
    micBtn.addEventListener('click', () => {
      alert('Aapka browser voice input (Speech-to-Text) support nahi karta.');
    });
  }

  // Fixed speech language for the browser-voice ("System voice") fallback.
  // This is intentionally a constant, not detected per-message — dynamically
  // switching it based on each reply's script was what made the voice sound
  // like it was randomly changing. It only ever changes if you edit this line.
  const FIXED_SPEECH_LANG = 'en-IN';

  /* ---------------- Gemini voice (Ursa, etc.) playback ----------------
     Gemini's TTS returns raw 16-bit PCM audio (no file header), so we
     wrap it in a minimal WAV header client-side before handing it to
     an <audio> element — browsers can't play headerless PCM directly. */
  function pcm16ToWavBlob(base64Pcm, sampleRate) {
    const binary = atob(base64Pcm);
    const len = binary.length;
    const buffer = new ArrayBuffer(44 + len);
    const view = new DataView(buffer);

    function writeString(offset, str) {
      for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    }

    writeString(0, 'RIFF');
    view.setUint32(4, 36 + len, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeString(36, 'data');
    view.setUint32(40, len, true);

    const bytes = new Uint8Array(buffer, 44);
    for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);

    return new Blob([buffer], { type: 'audio/wav' });
  }

  let currentTtsAudio = null;

  function getSelectedVoice() {
    return voiceSelect ? voiceSelect.value : 'gemini:Ursa';
  }

  async function speakWithGemini(text, onStart, onEnd) {
    const voiceValue = getSelectedVoice();
    if (voiceValue === 'browser') return false;

    const voiceName = voiceValue.split(':')[1] || 'Ursa';

    try {
      const res = await fetch(STREAM_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'tts', text: expandDigitsForSpeech(text), voice: voiceName })
      });

      if (!res.ok) {
        // Silently fall back to system voice on any API error (429 quota,
        // 503 overload, network hiccup). No error message in chat — the
        // user just hears the system voice instead, which is always better
        // than a wall of error text interrupting the conversation.
        let detail = '';
        try { detail = (await res.json())?.error?.message || ''; } catch (_) {}
        console.warn(`Gemini TTS ${res.status} — falling back to system voice. ${detail}`);
        return false;
      }

      const data = await res.json();
      if (!data.audioBase64) { console.warn('Gemini TTS: no audio in response'); return false; }

      const sampleRate = parseInt((data.mimeType || '').match(/rate=(\d+)/)?.[1] || '24000', 10);
      const blob = pcm16ToWavBlob(data.audioBase64, sampleRate);
      const url = URL.createObjectURL(blob);

      if (currentTtsAudio) {
        currentTtsAudio.pause();
        if (currentTtsAudio.src) URL.revokeObjectURL(currentTtsAudio.src);
      }

      currentTtsAudio = new Audio(url);
      currentTtsAudio.onended = () => { URL.revokeObjectURL(url); if (onEnd) onEnd(); };
      currentTtsAudio.onerror = () => { URL.revokeObjectURL(url); if (onEnd) onEnd(); };

      if (onStart) onStart();
      await currentTtsAudio.play();
      return true;
    } catch (err) {
      // Network-level failure — also silent fallback, no chat message.
      console.warn('Gemini TTS network error — falling back to system voice:', err.message);
      return false;
    }
  }

  function stopGeminiVoice() {
    if (currentTtsAudio) {
      currentTtsAudio.pause();
      if (currentTtsAudio.src) URL.revokeObjectURL(currentTtsAudio.src);
      currentTtsAudio = null;
    }
  }

  chatForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (isSending) return;

    const promptText = userInput.value.trim();
    if (!promptText && !pendingAttachments.length) return;

    const session = getCurrentSession();
    if (!session) return;

    isSending = true;

    const attachmentsForThisMessage = pendingAttachments.slice();
    pendingAttachments = [];
    renderPendingAttachments();

    userInput.value = '';
    sendBtn.disabled = true;
    sendLabel.textContent = '...';
    keepFocus();

    if (editingIndex !== null) {
      session.messages = session.messages.slice(0, editingIndex);
      renderCurrentSession();
      hideEditBanner();
    }

    if (!session.messages) session.messages = [];
    const userMsg = { role: 'user', text: promptText, attachments: attachmentsForThisMessage, createdAt: Date.now() };
    session.messages.push(userMsg);
    updateSessionTitle(session);
    saveSession(session);

    appendMessageDOM(userMsg, session.messages.length - 1);
    playSendSound();

    const apiHistory = buildApiHistory(session);

    const cacheKey = attachmentsForThisMessage.length === 0 ? (session.id + '|' + promptText.toLowerCase()) : null;
    if (cacheKey && responseCache.has(cacheKey)) {
      const cached = responseCache.get(cacheKey);
      const aiMsg = { role: 'ai', text: cached, attachments: [], createdAt: Date.now() };
      session.messages.push(aiMsg);
      saveSession(session);
      appendMessageDOM(aiMsg, session.messages.length - 1);
      playReceiveSound();
      finishSend();
      return;
    }

    const loadingId = appendTypingIndicator();
    let aiRow = null;
    let fullText = '';

    try {
      let historyToSend = apiHistory;
      try {
        await streamGemini(historyToSend, (chunk) => {
          fullText += chunk;
          if (!aiRow) {
            removeMessage(loadingId);
            aiRow = appendMessageDOM({ role: 'ai', text: '', attachments: [], createdAt: Date.now() }, session.messages.length);
          }
          updateMessageBubble(aiRow, fullText);
        });
      } catch (firstError) {
        // Self-healing: if we still hit 413 even after the history cap
        // and single-image trimming above (e.g. a huge legacy image sitting
        // in an old chat), retry ONE more time using only the current
        // message with no prior context, instead of forcing the user to
        // manually start a new chat.
        if (firstError.status === 413 && historyToSend.length > 1) {
          historyToSend = historyToSend.slice(-1);
          fullText = '';
          await streamGemini(historyToSend, (chunk) => {
            fullText += chunk;
            if (!aiRow) {
              removeMessage(loadingId);
              aiRow = appendMessageDOM({ role: 'ai', text: '', attachments: [], createdAt: Date.now() }, session.messages.length);
            }
            updateMessageBubble(aiRow, fullText);
          });
        } else {
          throw firstError;
        }
      }

      if (!aiRow) {
        removeMessage(loadingId);
        fullText = fullText || 'No response generated.';
        aiRow = appendMessageDOM({ role: 'ai', text: fullText, attachments: [], createdAt: Date.now() }, session.messages.length);
      }

      const aiMsg = { role: 'ai', text: fullText, attachments: [], createdAt: Date.now() };
      session.messages.push(aiMsg);
      saveSession(session);
      if (cacheKey) responseCache.set(cacheKey, fullText);
      playReceiveSound();

    } catch (error) {
      console.error(error);
      removeMessage(loadingId);
      const errMsg = 'Maaf kijiye, error aa gaya hai: ' + error.message;
      if (aiRow) {
        updateMessageBubble(aiRow, errMsg, true);
      } else {
        appendMessageDOM({ role: 'ai', text: errMsg, attachments: [], createdAt: Date.now() }, session.messages.length);
      }
      session.messages.push({ role: 'ai', text: errMsg, attachments: [], createdAt: Date.now() });
      saveSession(session);
    } finally {
      finishSend();
    }
  });

  function buildApiHistory(session) {
    const allMessages = session.messages || [];

    // Permanent guard against 413 Payload Too Large: never resend more
    // than the last MAX_HISTORY_MESSAGES turns as context, no matter how
    // long the saved chat history grows. Full history stays saved in
    // localStorage for the user to scroll back through; only what we SEND to
    // Gemini is capped.
    const MAX_HISTORY_MESSAGES = 20;
    const messages = allMessages.slice(-MAX_HISTORY_MESSAGES);

    // Fix for 413 Payload Too Large: earlier versions resent EVERY image
    // ever attached in this chat on every single request, so the payload
    // kept growing with the conversation (and could blow past the size
    // limit even when the new message was plain text like "Hi").
    // Now we only include the actual image data for the most recent
    // message that has attachments; older image turns are replaced with
    // a short text placeholder so the model still knows an image was
    // shared there, without resending the bytes.
    let lastAttachmentIndex = -1;
    messages.forEach((m, i) => {
      if ((m.attachments || []).length) lastAttachmentIndex = i;
    });

    return messages.map((m, i) => {
      const parts = [];
      if (m.text) parts.push({ text: m.text });

      const hasAttachments = (m.attachments || []).length > 0;
      if (hasAttachments && i === lastAttachmentIndex) {
        m.attachments.forEach(att => {
          parts.push({ inline_data: { mime_type: att.mimeType, data: att.base64 } });
        });
      } else if (hasAttachments) {
        parts.push({ text: '[an image was shared here earlier in the chat]' });
      }

      if (parts.length === 0) parts.push({ text: '' });

      return { role: m.role === 'user' ? 'user' : 'model', parts };
    });
  }

  function finishSend() {
    isSending = false;
    sendBtn.disabled = false;
    sendLabel.textContent = 'Send';
    keepFocus();
  }

  function keepFocus() {
    requestAnimationFrame(() => userInput.focus());
  }

  async function regenerateResponse(indexStr, regenBtn) {
    if (isSending) return;
    const index = parseInt(indexStr, 10);
    const session = getCurrentSession();
    if (!session || !session.messages || !session.messages[index]) return;

    const row = chatContainer.querySelector(`.row[data-index="${index}"]`);
    if (!row) return;

    const originalMsg = session.messages[index];
    const historyForRegen = buildApiHistory({ messages: session.messages.slice(0, index) });

    isSending = true;
    regenBtn.classList.add('spinning');
    regenBtn.disabled = true;
    updateMessageBubble(row, '');

    let fullText = '';
    try {
      await streamGemini(historyForRegen, (chunk) => {
        fullText += chunk;
        updateMessageBubble(row, fullText);
      });
      fullText = fullText || 'No response generated.';

      session.messages[index] = { role: 'ai', text: fullText, attachments: [], createdAt: Date.now() };
      saveSession(session);

      const timeEl = row.querySelector('.msg-time');
      if (timeEl) timeEl.textContent = formatRelativeTime(Date.now());

    } catch (error) {
      console.error(error);
      updateMessageBubble(row, (originalMsg.text || '') + '\n\n[Regenerate failed: ' + error.message + ']', true);
      setTimeout(() => updateMessageBubble(row, originalMsg.text || ''), 2500);
    } finally {
      isSending = false;
      regenBtn.classList.remove('spinning');
      regenBtn.disabled = false;
    }
  }

  /* ---------------- Streaming API call ---------------- */
  async function streamGemini(apiHistory, onChunk, retriesLeft = 2) {
    let response;
    try {
      response = await fetch(STREAM_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: apiHistory })
      });
    } catch (networkErr) {
      if (retriesLeft > 0) {
        await new Promise(res => setTimeout(res, 300));
        return streamGemini(apiHistory, onChunk, retriesLeft - 1);
      }
      throw networkErr;
    }

    if (!response.ok) {
      let errMsg = `API Error: ${response.status}`;
      try {
        const errData = await response.json();
        errMsg = errData.error?.message || errMsg;
      } catch (_) {}
      if (response.status === 413) {
        errMsg = 'This chat is too long or contains a very large file. Please start a "New Chat".';
      }
      if ((response.status === 503 || response.status === 429) && retriesLeft > 0) {
        await new Promise(res => setTimeout(res, 300));
        return streamGemini(apiHistory, onChunk, retriesLeft - 1);
      }
      const err = new Error(errMsg);
      err.status = response.status;
      throw err;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data:')) continue;
        const jsonStr = trimmed.slice(5).trim();
        if (!jsonStr || jsonStr === '[DONE]') continue;
        try {
          const parsed = JSON.parse(jsonStr);
          const piece = parsed.candidates?.[0]?.content?.parts?.[0]?.text;
          if (piece) onChunk(piece);
        } catch (_) {}
      }
    }
  }

  /* ---------------- DOM rendering ---------------- */
  function appendMessageDOM(msg, index) {
    const isUser = msg.role === 'user';
    const row = document.createElement('div');
    row.className = `row ${isUser ? 'user' : 'ai'}`;
    row.dataset.index = index;

    const imagesHtml = (msg.attachments || []).map(a => `<img class="attach-preview" src="${a.previewUrl}" alt="attachment">`).join('');

    const editBtnHtml = (isUser && index >= 0) ? `
      <div class="msg-actions">
        <button type="button" class="edit-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          Edit
        </button>
      </div>` : '';

    const aiActionsHtml = (!isUser && index >= 0) ? `
      <div class="ai-meta">
        <div class="ai-actions">
          <button type="button" class="copy-btn" title="Copy" aria-label="Copy response">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
          <button type="button" class="speak-btn" title="Listen" aria-label="Read response aloud">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
          </button>
          <button type="button" class="regen-btn" title="Regenerate" aria-label="Regenerate response">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          </button>
        </div>
        <span class="msg-time">${formatRelativeTime(msg.createdAt)}</span>
      </div>` : '';

    const bubbleTextHtml = isUser ? escapeHtml(msg.text || '') : renderMarkdown(msg.text || '');

    row.innerHTML = `
      <div class="avatar ${isUser ? 'user' : 'ai'}">${isUser ? 'You' : 'AI'}</div>
      <div class="msg-wrap">
        <div class="bubble">${imagesHtml}<span class="msg-text">${bubbleTextHtml}</span></div>
        ${editBtnHtml}
        ${aiActionsHtml}
      </div>
    `;

    if (isUser && index >= 0) {
      row.querySelector('.edit-btn').addEventListener('click', () => startEdit(index));
    }

    if (!isUser && index >= 0) {
      const copyBtn = row.querySelector('.copy-btn');
      const speakBtn = row.querySelector('.speak-btn');
      const regenBtn = row.querySelector('.regen-btn');

      copyBtn.addEventListener('click', () => {
        const text = row.querySelector('.msg-text').textContent || '';
        copyTextToClipboard(text).then(() => {
          copyBtn.classList.add('done');
          setTimeout(() => copyBtn.classList.remove('done'), 1200);
        }).catch(() => {
          copyBtn.classList.add('fail');
          setTimeout(() => copyBtn.classList.remove('fail'), 1200);
        });
      });

      speakBtn.addEventListener('click', async () => {
        const text = stripMarkdownForSpeech(row.querySelector('.msg-text').textContent || '');
        if (!text) return;

        if (speakBtn.classList.contains('speaking')) {
          window.speechSynthesis.cancel();
          stopGeminiVoice();
          speakBtn.classList.remove('speaking');
          return;
        }

        window.speechSynthesis.cancel();
        stopGeminiVoice();
        speakBtn.classList.add('speaking');

        const onDone = () => speakBtn.classList.remove('speaking');
        const usedGemini = await speakWithGemini(text, null, onDone);
        if (usedGemini) return;

        if (!('speechSynthesis' in window)) { onDone(); return; }
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = FIXED_SPEECH_LANG;
        utterance.onend = onDone;
        utterance.onerror = onDone;
        window.speechSynthesis.speak(utterance);
      });

      regenBtn.addEventListener('click', () => regenerateResponse(row.dataset.index, regenBtn));
    }

    chatContainer.appendChild(row);
    scrollToBottom();
    return row;
  }

  function updateMessageBubble(row, text, isError = false) {
    const bubble = row.querySelector('.bubble');
    bubble.classList.toggle('error', isError);
    const textSpan = bubble.querySelector('.msg-text');
    if (textSpan) textSpan.innerHTML = isError ? escapeHtml(text) : renderMarkdown(text);
    scrollToBottom();
  }

  function appendTypingIndicator() {
    const id = 'typing-' + Date.now();
    const row = document.createElement('div');
    row.id = id;
    row.className = 'row ai';
    row.innerHTML = `
      <div class="avatar ai">AI</div>
      <div class="msg-wrap"><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div></div>
    `;
    chatContainer.appendChild(row);
    scrollToBottom();
    return id;
  }

  function removeMessage(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function scrollToBottom() {
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  /* Robust copy helper: tries the async Clipboard API first (needs a secure
     context/permission), then falls back to the classic execCommand('copy')
     trick using a hidden textarea. WebViews (e.g. Kodular's) often lack
     Clipboard API support or block it silently, which is why plain
     navigator.clipboard.writeText() was failing without any visible error. */
  function copyTextToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    }
    return fallbackCopy(text);
  }

  function fallbackCopy(text) {
    return new Promise((resolve, reject) => {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '0';
        ta.style.left = '0';
        ta.style.width = '1px';
        ta.style.height = '1px';
        ta.style.padding = '0';
        ta.style.border = 'none';
        ta.style.outline = 'none';
        ta.style.boxShadow = 'none';
        ta.style.background = 'transparent';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, text.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        ok ? resolve() : reject(new Error('execCommand copy failed'));
      } catch (err) {
        reject(err);
      }
    });
  }

  function escapeHtml(text) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return text.replace(/[&<>"']/g, m => map[m]);
  }

  function renderMarkdown(text) {
    let escaped = escapeHtml(text || '');

    // Fenced code blocks ```code```
    escaped = escaped.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);

    // Inline code `code`
    escaped = escaped.replace(/`([^`\n]+)`/g, '<code>$1</code>');

    // Bold **text** or __text__
    escaped = escaped.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    escaped = escaped.replace(/__([^_]+)__/g, '<strong>$1</strong>');

    // Italic *text* or _text_
    escaped = escaped.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    escaped = escaped.replace(/(^|[^a-zA-Z0-9])_([^_]+)_(?![a-zA-Z0-9])/g, '$1<em>$2</em>');

    return escaped;
  }

  /* ---------------- Speech-safe text ----------------
     The text-to-speech engine should only ever speak the actual words —
     never markdown symbols like *, _, `, or #. This strips all markdown
     syntax (keeping the wrapped content) before anything is handed to
     SpeechSynthesisUtterance, for both the per-message speaker button
     and live voice conversation mode. */
  const SPEECH_DIGIT_WORDS = ['zero','one','two','three','four','five','six','seven','eight','nine'];

  function expandDigitsForSpeech(text) {
    // Long digit runs (phone numbers, codes) get spelled out digit-by-digit
    // with the word "zero" (never "oh") so the TTS engine reads them
    // clearly instead of as one huge number or misreading 0 as the letter O.
    return (text || '').replace(/\d{5,}/g, (match) =>
      match.split('').map(d => SPEECH_DIGIT_WORDS[+d]).join(' ')
    );
  }

  function stripMarkdownForSpeech(text) {
    let plain = text || '';

    plain = plain.replace(/```([\s\S]*?)```/g, (_, code) => code.trim());   // fenced code blocks -> content only
    plain = plain.replace(/`([^`\n]+)`/g, '$1');                            // inline code
    plain = plain.replace(/\*\*([^*]+)\*\*/g, '$1');                        // bold **text**
    plain = plain.replace(/__([^_]+)__/g, '$1');                            // bold __text__
    plain = plain.replace(/\*([^*]+)\*/g, '$1');                            // italic *text*
    plain = plain.replace(/(^|[^a-zA-Z0-9])_([^_]+)_(?![a-zA-Z0-9])/g, '$1$2'); // italic _text_
    plain = plain.replace(/^\s{0,3}#{1,6}\s+/gm, '');                       // markdown headers
    plain = plain.replace(/^\s*[-*+]\s+/gm, '');                            // bullet markers
    plain = plain.replace(/[*_~`#]/g, '');                                  // any leftover stray symbols

    plain = expandDigitsForSpeech(plain);

    return plain.trim();
  }

  function formatRelativeTime(ts) {
    if (!ts) return '';
    const diffSec = Math.floor((Date.now() - ts) / 1000);
    if (diffSec < 10) return 'Just now';
    if (diffSec < 60) return diffSec + 's ago';
    const diffMin = Math.floor(diffSec / 60);
    if (diffMin < 60) return diffMin + (diffMin === 1 ? ' minute ago' : ' minutes ago');
    const diffHr = Math.floor(diffMin / 60);
    if (diffHr < 24) return diffHr + (diffHr === 1 ? ' hour ago' : ' hours ago');
    const diffDay = Math.floor(diffHr / 24);
    if (diffDay < 30) return diffDay + (diffDay === 1 ? ' day ago' : ' days ago');
    return new Date(ts).toLocaleDateString();
  }
</script>
<script>
/* =========================================================================
   ZCam — Zamir AI camera system (same to same)
   Camera button -> native phone camera -> photo -> thumbnail above input.
   1. Kodular APK (top page)  : AppInventor.setWebViewString('OPEN_CAMERA:<ts>')
   2. Inside Ash Costing iframe: postMessage -> parent -> Kodular native camera
   3. Normal browser / no bridge: <input capture="environment"> fallback
   Photo comes back as "IMG:<base64>" (receiveFromApp / receiveNativeImage / receiveNativeChunk)
   ========================================================================= */
(function () {
    if (window.ZCam) return;
    var CAM_MAX_SIDE = 800, CAM_QUALITY = 0.7;
    var onDone = null, busy = false, lastSig = '', pollUntil = 0, pongT = null;
    var inIframe = false;
    try { inIframe = window.parent && window.parent !== window; } catch (e) {}

    function hasBridge() { return !!(window.AppInventor && typeof window.AppInventor.setWebViewString === 'function'); }
    function fallbackInput() {
        var inp = document.getElementById('camera-input');
        try { inp.value = ''; } catch (e) {}
        inp.click();
    }
    function armPoll() { pollUntil = Date.now() + 90000; }

    function compress(raw, mime) {
        return new Promise(function (resolve, reject) {
            var img = new Image();
            img.onload = function () {
                try {
                    var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
                    if (!w || !h) throw new Error('empty image');
                    var k = Math.min(1, CAM_MAX_SIDE / Math.max(w, h));
                    w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
                    var c = document.createElement('canvas'); c.width = w; c.height = h;
                    var ctx = c.getContext('2d');
                    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
                    ctx.drawImage(img, 0, 0, w, h);
                    var out = c.toDataURL('image/jpeg', CAM_QUALITY);
                    c.width = c.height = 0; img.onload = img.onerror = null; img.src = '';
                    resolve(out);
                } catch (e) { reject(e); }
            };
            img.onerror = function () { reject(new Error('image decode failed')); };
            img.src = 'data:' + mime + ';base64,' + raw;
        });
    }

    async function receiveNativeImageAsync(arg1, arg2) {
        if (busy) return;
        busy = true;
        try {
            var raw = String(arg1 || ''), mime = arg2 ? String(arg2) : '';
            var m = raw.match(/^data:([^;,]+)[^,]*,/);
            if (m) { if (!mime) mime = m[1]; raw = raw.slice(m[0].length); }
            raw = raw.replace(/[\r\n\s]/g, '').replace(/-/g, '+').replace(/_/g, '/');
            if (!raw) return;
            if (raw.indexOf('iVBOR') === 0) mime = 'image/png';
            else if (raw.indexOf('/9j/') === 0) mime = 'image/jpeg';
            if (!mime) mime = 'image/jpeg';
            while (raw.length % 4) raw += '=';
            var dataUrl = await compress(raw, mime);
            raw = null;
            var cb = onDone; onDone = null;   // ek camera click par sirf ek photo
            if (cb) cb(dataUrl);
        } catch (err) { console.error('receiveNativeImage failed:', err); }
        finally { busy = false; }
    }
    // must return undefined (javascript: URL returning a value blanks the page)
    window.receiveNativeImage = function (a, b) { receiveNativeImageAsync(a, b); };
    window.ZCamReceive = window.receiveNativeImage;

    window.__camChunks = [];
    window.receiveNativeChunk = function (index, total, piece) {
        try {
            index = Number(index); total = Number(total);
            if (index === 0) window.__camChunks = [];
            window.__camChunks[index] = String(piece || '');
            var have = 0;
            for (var i = 0; i < total; i++) if (window.__camChunks[i] !== undefined) have++;
            if (have === total) { var all = window.__camChunks.join(''); window.__camChunks = []; window.receiveNativeImage(all, ''); }
        } catch (e) { console.error('receiveNativeChunk failed:', e); }
    };

    function readAppString(arg) {
        try {
            if (typeof arg === 'string' && arg) return arg;
            if (window.AppInventor && typeof window.AppInventor.getWebViewString === 'function')
                return String(window.AppInventor.getWebViewString() || '');
        } catch (e) {}
        return '';
    }
    function handleAppString(str) {
        if (!str || str.indexOf('IMG:') !== 0) return false;
        var sig = str.length + ':' + str.slice(0, 40) + ':' + str.slice(-40);
        if (sig === lastSig) return false;
        lastSig = sig; pollUntil = 0;
        window.receiveNativeImage(str.slice(4).trim(), '');
        return true;
    }
    window.receiveFromApp = function (arg) { try { handleAppString(readAppString(arg)); } catch (e) {} };
    setInterval(function () {
        if (Date.now() > pollUntil) return;
        try { handleAppString(readAppString()); } catch (e) {}
    }, 1000);

    function openNative() {
        window.AppInventor.setWebViewString('OPEN_CAMERA OPEN CAMERA:' + Date.now());
        armPoll();
    }

    // public: ZCam.open('environment', function(dataUrl){ ... })
    function open(which, cb) {
        onDone = cb;
        try {
            if (hasBridge()) { openNative(); return; }
        } catch (e) { console.error('Kodular bridge failed:', e); }
        if (inIframe) {
            clearTimeout(pongT);
            pongT = setTimeout(fallbackInput, 1500);          // parent has no bridge -> browser camera
            try { window.parent.postMessage({ zcam: 'ping', want: 'open' }, '*'); }
            catch (e) { clearTimeout(pongT); fallbackInput(); }
            return;
        }
        fallbackInput();
    }

    window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || !d.zcam) return;
        if (d.zcam === 'pong') {
            clearTimeout(pongT);
            try { window.parent.postMessage({ zcam: 'open', cmd: 'OPEN_CAMERA' }, '*'); } catch (err) { fallbackInput(); }
        }
        if (d.zcam === 'result' && d.dataUrl) window.receiveNativeImage(d.dataUrl, '');
    });

    window.ZCam = { open: open, close: function () {} };
})();
</script>
